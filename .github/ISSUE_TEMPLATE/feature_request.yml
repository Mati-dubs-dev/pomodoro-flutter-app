name: Feature request
description: Suggest an improvement to Pomodoro Pro.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: Explain the use case you want to address.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the expected behavior.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: impact
    attributes:
      label: Expected impact
      options:
        - label: Changes the UI.
        - label: Changes persisted data.
        - label: Requires new permissions.
        - label: Affects accessibility.
        - label: Affects multiple platforms.
  - type: checkboxes
    id: checks
    attributes:
      label: Check
      options:
        - label: I searched existing requests before creating this one.
          required: true
