name: Reportar un error
description: Informa un comportamiento reproducible de Pomodoro Pro.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Gracias por ayudar. No incluyas datos personales ni vulnerabilidades.
  - type: textarea
    id: description
    attributes:
      label: Descripción
      description: Explica qué ocurrió y qué esperabas.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abre...
        2. Pulsa...
        3. Observa...
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Plataforma
      options:
        - Android
        - iOS
        - Web
        - Windows
        - macOS
        - Linux
        - Varias plataformas
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versiones
      description: Pomodoro Pro, Flutter, Dart y sistema operativo.
  - type: textarea
    id: logs
    attributes:
      label: Registros o capturas
      description: Adjunta solamente información sin datos sensibles.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Comprobaciones
      options:
        - label: Busqué issues existentes sobre el mismo problema.
          required: true
        - label: Este reporte no contiene una vulnerabilidad.
          required: true
