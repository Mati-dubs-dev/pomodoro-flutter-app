name: Bug report
description: Report reproducible incorrect behavior in Pomodoro Pro.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thank you for helping. Do not include personal data or security vulnerabilities.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Explain what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Android, iOS, Web, Windows, macOS, Linux, Multiple platforms]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Pomodoro Pro, Flutter, Dart, and operating-system versions.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Attach only information that contains no sensitive data.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This report does not contain a security vulnerability.
          required: true
