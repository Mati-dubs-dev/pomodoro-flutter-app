name: pomodoro_pro
description: "Pomodoro timer with sessions, notifications and settings."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Notificaciones locales
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Persistencia
  shared_preferences: ^2.3.2
  cupertino_icons: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon.png
  adaptive_icon_background: "#1A1A2E"
  adaptive_icon_foreground: assets/app_icon.png
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#1A1A2E"
  web:
    generate: true
    image_path: assets/app_icon.png
    background_color: "#1A1A2E"
    theme_color: "#FF6B6B"
  windows:
    generate: true
    image_path: assets/app_icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/app_icon.png
